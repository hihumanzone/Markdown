<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Icon content with shadow -->
  <g filter="url(#glow)">
    <!-- Markdown "M" -->
    <path d="M 13,44 V 20 L 23,30 L 33,20 V 44" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- LaTeX Sigma "Σ" -->
    <path d="M 51,20 H 39 L 45,32 L 39,44 H 51" fill="none" stroke="#67e8f9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
